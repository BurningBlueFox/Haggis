<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haggis</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f3f4f6;
      font: 1rem system-ui, sans-serif;
    }
    main { width: min(90vw, 960px); }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #030712;
      border: 1px solid #374151;
    }
    details {
      margin-block: 1rem;
      padding: .65rem .8rem;
      border: 1px solid #374151;
      border-radius: .35rem;
      background: #0f172a;
    }
    summary { cursor: pointer; }
    #gpu-debug {
      max-height: 24rem;
      overflow: auto;
      margin: .65rem 0 0;
      padding: .65rem;
      background: #030712;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <main>
    <h1>Haggis</h1>
    <canvas id="canvas" width="960" height="540" aria-label="Haggis viewport"></canvas>
    <p id="status" role="status">Loading Haggis…</p>
    <label><input type="checkbox" id="compute" checked> Run inference workload</label>
    <p id="metrics"></p>
    <details>
      <summary>GPU debug information</summary>
      <pre id="gpu-debug" tabindex="0" aria-label="WebGPU adapter and device details">Waiting for WebGPU…</pre>
    </details>
    <noscript>Enable JavaScript to run Haggis.</noscript>
  </main>
  <script>
    const statusElement = document.getElementById("status");
    const gpuDebugElement = document.getElementById("gpu-debug");
    const pendingGpuDebug = gpuDebugElement.textContent;
    function showStartupError(message) {
      statusElement.textContent = message;
      if (gpuDebugElement.textContent === pendingGpuDebug) {
        gpuDebugElement.textContent = message;
      }
    }
    window.addEventListener("error", (event) => {
      if (event.target instanceof HTMLScriptElement) {
        showStartupError("Could not load Haggis. Reload the page to try again.");
      }
    }, true);
    var Module = {
      canvas: document.getElementById("canvas"),
      print(message) { statusElement.textContent = message; },
      onAbort() { showStartupError("Haggis could not start. Reload the page to try again."); }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
